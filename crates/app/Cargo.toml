[package]
name = "app"
description = "Desktop interface for SQLRestore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sqlrestore-core = { path = "../core" }
eframe.workspace = true
rfd.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "sqlrestore"
path = "src/main.rs"

[package.metadata.packager]
before-packaging-command = "cargo build --release -p app"
product-name = "SQLRestore"
identifier = "com.rikelmylopes.sqlrestore"
description = "Restore .sql backup files on PostgreSQL"
long-description = "Cross-platform desktop application to restore .sql backup files on PostgreSQL using the database connection."
homepage = "https://github.com/Rikelmy-Lopes/SQLRestore"
publisher = "Rikelmy Lopes"
authors = ["Rikelmy Lopes"]
license-file = "../../LICENSE"
category = "Utility"
icons = ["../../assets/icon.png"]
out-dir = "../../dist"

[package.metadata.packager.nsis]
installer-icon = "../../assets/icon.ico"
installer-mode = "currentUser"
appdata-paths = ["$LOCALAPPDATA/$PRODUCTNAME"]
languages = ["English", "PortugueseBR"]

[package.metadata.packager.deb]
package-name = "sqlrestore"
section = "utils"
priority = "optional"
depends = [
    "libc6",
    "libx11-6",
    "libxcursor1",
    "libxrandr2",
    "libxi6",
    "libxkbcommon0",
    "libwayland-client0",
    "libgl1",
]
